name: Verify standalone factory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
      - name: Install Docker CLI on macOS (no daemon)
        if: runner.os == 'macOS'
        run: brew install docker
      - run: npm ci
      - run: npm run setup
      - run: npm run doctor -- --offline
      - run: npm run verify
# Live engine isolation and model missions are operator qualification, not inferred from this offline job.
